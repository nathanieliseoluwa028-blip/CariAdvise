<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - CariAdvise</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: linear-gradient(135deg, #e9d5ff, #fbcfe8, #fde68a); margin: 0; padding: 15px; }
.card { background: white; max-width: 600px; margin: 0 auto; padding: 25px 20px; border-radius: 20px; }
.q { margin: 18px 0; padding: 15px; background: #f8f8ff; border-radius: 12px; }
.q p { font-size: 16px; line-height: 1.4; margin-top: 0; }
label { display: block; margin: 10px 0; cursor: pointer; font-size: 15px; line-height: 1.4; padding: 8px; background: white; border-radius: 8px; }
input[type="radio"] { transform: scale(1.3); margin-right: 8px; }
.btn { background: #6C5CE7; color: white; padding: 16px; border: none; border-radius: 30px; font-size: 17px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
<h1 style="text-align:center;">🧠 Find Your Career</h1>
<p style="text-align:center; color:#555;">Answer honestly! There are no wrong answers.</p>
<form action="/quiz" method="post">
{% for q in questions %}
{% set qnum = loop.index0 %}
<div class="q">
<p><strong>Q{{ loop.index }}. {{ q[0] }}</strong></p>
{% for opt in q[1] %}
<label><input type="radio" name="q{{ qnum }}" value="{{ loop.index0 }}" required> {{ opt[0] }}</label>
{% endfor %}
</div>
{% endfor %}
<button class="btn" type="submit">See My Result →</button>
</form>
</div>
</body>
</html>
