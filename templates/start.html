<!DOCTYPE html>
<html>
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1">   
<title>Start - CariAdvise</title>
<style>
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #e0c3fc, #fbc2eb); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: #fffdf5; width: 100%; max-width: 520px; padding: 35px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  h1 { margin: 0 0 10px 0; color: #222; font-size: 28px; }
  .logo { color: #5b2a86; font-size: 20px; font-weight: bold; margin-bottom: 5px; }
  p { color: #555; font-size: 15px; line-height: 1.5; }
  label { display: block; text-align: left; font-weight: bold; margin: 20px 0 8px 0; color: #333; }
  input { width: 100%; padding: 13px; font-size: 16px; border: 2px solid #e8d5f5; border-radius: 10px; box-sizing: border-box; outline: none; background: white; }
  input:focus { border-color: #9b59b6; }
  button { width: 100%; margin-top: 20px; padding: 14px; font-size: 17px; font-weight: bold; color: white; background: #7b2cbf; border: none; border-radius: 10px; cursor: pointer; }
  button:hover { background: #5b2a86; }
  .small { font-size: 12px; color: #888; margin-top: 15px; }
  a { color: #7b2cbf; text-decoration: none; }
  @media (min-width: 900px) {
  .card {
    max-width: 900px !important;
    padding: 40px !important;
  }
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">✨ CariAdvise ✨</div>
    <h1>🌟 Start Your Career Quiz</h1>
    <p>Enter your name to start. Your name is only used to save your result.</p>
    <form method="POST" action="/start">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="e.g. Nathan" required>
      <button type="submit">Start Quiz →</button>
    </form>
    <p class="small"><a href="/">← Back to Home</a> • Made for students, by a student.</p>
  </div>
</body>
</html>
